name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: backend/pyproject.toml

      - name: Install deps
        run: uv sync

      - name: Lint with ruff
        run: uv run ruff check services/qa_service/ services/common/ api/ tools/ router/ tests/

      - name: Test (unit tests only, external services excluded)
        run: uv run pytest tests/test_qa_service.py tests/test_qa_full_evidence_mode.py tests/test_qa_coverage_gaps.py tests/test_medical_guard.py tests/test_evidence_payloads.py tests/test_chat_api.py -x -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
